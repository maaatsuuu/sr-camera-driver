camera:
  name: "routecam"
  type: "rtsp"
  backend: "gstreamer"

gstreamer:
  ip: "${ROUTECAM_IP}"
  rtsp_port: "${ROUTECAM_RTSP_PORT}"
  rtsp_path: "${ROUTECAM_RTSP_PATH}"
  latency: "${ROUTECAM_LATENCY}"
  default_preset: "${ROUTECAM_PRESET}"

  pipeline_template: >
    rtspsrc location=rtsp://${ip}:${rtsp_port}${rtsp_path} latency=${latency} !
    rtpjitterbuffer drop-on-latency=${drop_on_latency} latency=${latency} !
    routecamjpegfix !
    rtpjpegdepay !
    jpegparse

  preview_sink: "autovideosink"
  drop_on_latency: true

  presets:
    mjpeg_4k_3840x2160_30:
      width: 3840
      height: 2160
      fps_num: 30
      fps_den: 1
      image_encoding: "jpeg"

gscam2:
  gst_plugin_path: "${WORKSPACE_DIR}/install/sr_camera_gst_plugins/lib/gstreamer-1.0"
  gscam_config: ""
  sync_sink: false
  preroll: false
  use_gst_timestamps: false
  image_encoding: "jpeg"
  camera_info_url: ""
  camera_name: "${ROUTECAM_CAMERA_NAME}"
  frame_id: "${ROUTECAM_FRAME_ID}"
  skip: 0

ros:
  namespace: "${ROUTECAM_NAMESPACE}"
  image_topic: "image_raw"
  camera_info_topic: "camera_info"
